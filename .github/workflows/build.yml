name: build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  platform: linux/amd64,   image: "debian:bookworm", experimental: false }
          - { arch: aarch64, platform: linux/arm64,   image: "debian:bookworm", experimental: false }
          - { arch: armv7,   platform: linux/arm/v7,  image: "debian:bookworm", experimental: false }
          - { arch: i386,    platform: linux/386,     image: "debian:bookworm", experimental: false }
          - { arch: riscv64, platform: linux/riscv64, image: "debian:trixie",   experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build in a ${{ matrix.platform }} container
        run: |
          mkdir -p out
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w ${{ matrix.image }} bash -ec '
            apt-get update -qq
            apt-get install -y -qq build-essential git pkg-config libdbus-1-dev libgl1-mesa-dev libx11-dev \
              libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev >/dev/null
            git config --global --add safe.directory /w
            cc build.c -o build && ./build
            strip bin/nanoblue && cp bin/nanoblue out/nanoblue-linux-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with: { name: "nanoblue-linux-${{ matrix.arch }}", path: "out/*" }
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches src/version.h
        run: grep -q "\"${GITHUB_REF_NAME#v}\"" src/version.h
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum nanoblue-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*", generate_release_notes: true }
