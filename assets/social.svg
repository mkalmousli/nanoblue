  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  <g fill="none" stroke="#9fdcff" stroke-linecap="round" filter="url(#glow)">
